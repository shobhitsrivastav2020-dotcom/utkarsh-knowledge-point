<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login - Utkarsh Knowledge Point</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf1fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.login-box {
    background: white;
    width: 90%;
    max-width: 380px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000015;
}

h1 {
    color: #12345a;
    text-align: center;
}

p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #12345a;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

a {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12345a;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>Owner Login</h1>

    <p>Utkarsh Knowledge Point</p>

    <input
        type="email"
        placeholder="Owner Email"
    >

    <input
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <a href="index.html">Back to Students Website</a>

</div>

<script>

function login() {
    alert("Login system will be connected soon.");
}

</script>

</body>
</html>
