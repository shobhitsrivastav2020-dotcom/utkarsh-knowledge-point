
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login - Utkarsh Knowledge Point</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf1fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.login-box {
    background: white;
    width: 90%;
    max-width: 380px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000015;
}

h1 {
    color: #12345a;
    text-align: center;
}

p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #12345a;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

a {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12345a;
}

#message {
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>Owner Login</h1>

    <p>Utkarsh Knowledge Point</p>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Owner Email"
            autocomplete="username"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            Login
        </button>

    </form>

    <p id="message" role="status"></p>

    <a href="index.html">Back to Students Website</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyByxJxq9kMNoTrzLfmmYFK-r9vYKVfGO68",
    authDomain: "utkarsh-knowledge-point.firebaseapp.com",
    projectId: "utkarsh-knowledge-point",
    storageBucket: "utkarsh-knowledge-point.firebasestorage.app",
    messagingSenderId: "607719849434",
    appId: "1:607719849434:web:5bc0a6b32644476c1354e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Logging in...";
    loginButton.disabled = true;

    try {

        const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.textContent =
            "Login successful! Welcome, " +
            result.user.email;

    } catch (error) {

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {

            message.textContent =
                "Email or password is incorrect.";

        } else {

            message.textContent =
                "Login failed: " + error.message;

        }

    } finally {

        loginButton.disabled = false;

    }

});

</script>

</body>
</html>
