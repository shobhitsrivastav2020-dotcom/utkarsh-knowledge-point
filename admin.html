

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login - Utkarsh Knowledge Point</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf1fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 380px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000015;
}

h1 {
    color: #12345a;
    text-align: center;
    font-size: 27px;
}

p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #12345a;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

a {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #12345a;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>Owner Login</h1>

    <p>Utkarsh Knowledge Point</p>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Owner Email"
            autocomplete="username"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            Login
        </button>

    </form>

    <p id="message" role="status"></p>

    <a href="index.html">
        Back to Students Website
    </a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyByxJxq9kMNoTrzLfmmYFK-r9vYKVfGO68",
    authDomain: "utkarsh-knowledge-point.firebaseapp.com",
    projectId: "utkarsh-knowledge-point",
    storageBucket: "utkarsh-knowledge-point.firebasestorage.app",
    messagingSenderId: "607719849434",
    appId: "1:607719849434:web:5bc0a6b32644476c1354e3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const form = document.getElementById("loginForm");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const message = document.getElementById("message");

const loginButton = document.getElementById("loginButton");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = emailInput.value.trim();

    const password = passwordInput.value;

    message.textContent = "Please wait...";

    loginButton.disabled = true;

    try {

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

       message.textContent = "Login successful!";

window.location.href = "dashboard.html";

        passwordInput.value = "";

    } catch (error) {

        console.error("Firebase Login Error:", error);

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {

            message.textContent =
                "Incorrect email or password.";

        } else if (
            error.code === "auth/invalid-email"
        ) {

            message.textContent =
                "Please enter a valid email address.";

        } else if (
            error.code === "auth/too-many-requests"
        ) {

            message.textContent =
                "Too many attempts. Please try later.";

        } else {

            message.textContent =
                "Login error: " + error.code;

        }

    } finally {

        loginButton.disabled = false;

    }

});

</script>

</body>
</html>
